services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-whatsapp_alerts}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    volumes:
      - whatsapp-mysql-data:/var/lib/mysql
    command:
      - --innodb-buffer-pool-size=128M
      - --max-connections=50
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-P",
          "3306",
          "--protocol=TCP",
          "-uroot",
          "-p${MYSQL_ROOT_PASSWORD}",
        ]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 300M

  migrate:
    build:
      context: ./backend
    restart: "no"
    command: ["npx", "prisma", "migrate", "deploy"]
    env_file:
      - ./backend/.env.production
    depends_on:
      mysql:
        condition: service_healthy

  api:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 180M

  message-worker:
    build:
      context: ./backend
    restart: unless-stopped
    command: ["node", "--experimental-specifier-resolution=node", "dist/workers/message.worker.js"]
    env_file:
      - ./backend/.env.production
    depends_on:
      migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 120M

  webhook-worker:
    build:
      context: ./backend
    restart: unless-stopped
    command: ["node", "--experimental-specifier-resolution=node", "dist/workers/webhook.worker.js"]
    env_file:
      - ./backend/.env.production
    depends_on:
      migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 120M

volumes:
  whatsapp-mysql-data:
