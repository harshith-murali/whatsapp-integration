services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: whatsapp_alerts
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy

  message-worker:
    build:
      context: ./backend
    command: ["node", "--experimental-specifier-resolution=node", "dist/workers/message.worker.js"]
    env_file:
      - ./backend/.env
    depends_on:
      mysql:
        condition: service_healthy

  webhook-worker:
    build:
      context: ./backend
    command: ["node", "--experimental-specifier-resolution=node", "dist/workers/webhook.worker.js"]
    env_file:
      - ./backend/.env
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  mysql-data:
